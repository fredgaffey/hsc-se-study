<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradeo Exams — SEN Offline</title>
<style>
:root{--rail:#1c1a35;--bg:#eceaf4;--card:#fff;--fg:#1a1a2e;--mut:#6b7280;--bd:#e5e7f0;
 --pinkbg:#fde8ec;--pinkfg:#d64560;--greenbg:#e6f7ec;--greenfg:#1e7a4a;--lime:#d4e84a;--chip:#f1f2f6}
@media(prefers-color-scheme:dark){:root{--bg:#14131f;--card:#1e1d2e;--fg:#e8e8f0;--mut:#9a9ab0;--bd:#2e2d42;
 --pinkbg:#3a1f28;--greenbg:#16301f;--chip:#26253a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 ui-rounded,"SF Pro Rounded","Segoe UI Variable",-apple-system,Segoe UI,Roboto,sans-serif;
 background:var(--bg);color:var(--fg)}
.wrap{display:flex;min-height:100vh}
.rail{width:80px;flex:0 0 80px;background:var(--rail);display:flex;flex-direction:column;align-items:center;
 padding:1.1rem 0;gap:1.6rem;position:sticky;top:0;height:100vh}
.logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fff 55%,var(--lime) 55%);
 box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.rail i{width:22px;height:22px;border:2px solid #6b6a86;border-radius:6px;display:block}
.rail i.on{border-color:var(--lime);background:rgba(212,232,74,.16)}
.main{flex:1;min-width:0}
.top{background:var(--card);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;
 border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.top h1{font-size:1.15rem;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;
 padding:.5rem 1.05rem;font:inherit;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem}
.pill:hover{border-color:var(--mut)}
.body{padding:1.5rem}
.bar{display:flex;gap:1rem;align-items:center;margin-bottom:1.1rem;flex-wrap:wrap}
select.sel{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;
 padding:.55rem 1.05rem;font:inherit;font-size:.88rem;max-width:min(520px,72vw)}
.card{background:var(--card);border-radius:16px;padding:1.15rem 1.35rem;margin-bottom:1.1rem;
 box-shadow:0 1px 2px rgba(20,20,50,.05)}
.card h2{font-size:1rem;margin:0 0 .9rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:700;padding:.55rem .4rem;border-bottom:2px solid var(--bd)}
th.r,td.r{text-align:right}
td{padding:.55rem .4rem;border-bottom:1px solid var(--bd);color:var(--mut)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;color:var(--fg);border-top:2px solid var(--bd);border-bottom:0}
.qhead{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:1rem}
.qhead .t{font-weight:700;flex:1;min-width:200px}
.mk{font-size:.76rem;font-weight:600;padding:.28rem .7rem;border-radius:999px;white-space:nowrap}
.mk.zero{background:var(--pinkbg);color:var(--pinkfg)}
.mk.full{background:var(--greenbg);color:var(--greenfg)}
.mk.part{background:#fff4e0;color:#a35b00}
.chip{font-size:.76rem;background:var(--chip);color:var(--mut);padding:.28rem .7rem;border-radius:999px}
.cols{display:grid;grid-template-columns:minmax(160px,26%) 1fr;gap:1.6rem}
@media(max-width:720px){.cols{grid-template-columns:1fr;gap:.8rem}}
.part{font-weight:600;font-size:.9rem;margin-bottom:.4rem}
.qtext{color:var(--fg);font-size:.93rem}
.ansLbl{font-weight:700;font-size:.9rem;margin-bottom:.6rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;border:1px solid var(--bd);background:var(--card);
 border-radius:12px;padding:.7rem .85rem;margin-bottom:.55rem}
.opt .b{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.wrong .b{background:var(--pinkbg);color:var(--pinkfg)}
.opt.correct .b{background:var(--greenbg);color:var(--greenfg)}
.opt .x{flex:1;font-size:.92rem}
.opt .v{font-size:.76rem;font-weight:600;align-self:center}
.opt.wrong .v{color:var(--pinkfg)}
.opt.correct .v{color:var(--greenfg)}
.opt.correct{border-color:#bfe6cd}
.written{background:var(--chip);border-radius:12px;padding:.75rem .9rem;white-space:pre-wrap;font-size:.92rem}
.note{background:#fff8e6;border-left:3px solid #e0a800;padding:.7rem .9rem;border-radius:0 10px 10px 0;
 font-size:.85rem;color:var(--mut);margin-bottom:1.1rem}
@media(prefers-color-scheme:dark){.note{background:#2a2415}}
a.back{color:var(--mut);text-decoration:none;font-size:.85rem}
[x-cloak]{display:none!important}
</style>
<script src="../data/gradeo.js" defer></script>
<script src="../vendor/alpine.min.js" defer></script>
</head><body>
<div class="wrap" x-data="g()" x-cloak>
 <aside class="rail">
  <div class="logo"></div>
  <i class="on"></i><i></i><i></i>
 </aside>
 <div class="main">
  <header class="top">
   <h1 x-text="ex.title"></h1>
   <a class="pill" href="../index.html">⇤ Exit</a>
  </header>
  <div class="body">
   <div class="bar">
    <select class="sel" x-model.number="idx">
     <template x-for="(e,i) in exams" :key="i"><option :value="i" x-text="e.title"></option></template>
    </select>
    <button class="pill" @click="window.print()">🖨 Print</button>
    <a class="back" href="browse.html">Browse all questions →</a>
   </div>
   <div class="note">Your own sat exams. Multiple-choice options show correct/wrong.
    Exemplar and Feedback are tabbed content on Gradeo and were not captured.</div>

   <div class="card">
    <h2>Marking summary</h2>
    <table>
     <thead><tr><th>Question</th><th>Part</th><th class="r">Mark</th><th class="r">Available</th></tr></thead>
     <tbody>
      <template x-for="(r,i) in ex.rows" :key="i">
       <tr><td x-text="r[0]"></td><td x-text="r[1]"></td>
        <td class="r" x-text="r[2]"></td><td class="r" x-text="r[3]"></td></tr>
      </template>
     </tbody>
     <tfoot><tr><td></td><td></td><td class="r" x-text="'Mark: '+ex.mark"></td>
      <td class="r" x-text="'Available: '+ex.avail"></td></tr></tfoot>
    </table>
   </div>

   <template x-for="(q,qi) in ex.qs" :key="qi">
    <div class="card">
     <div class="qhead">
      <span class="t" x-text="q.title"></span>
      <span class="mk" :class="cls(q.mark)" x-text="q.mark"></span>
      <span class="chip">☆ Exemplar</span><span class="chip">◷ Feedback</span>
     </div>
     <div class="cols">
      <div>
       <div class="part" x-text="q.part"></div>
       <template x-for="(p,pi) in q.qtext" :key="pi"><div class="qtext" x-text="p"></div></template>
      </div>
      <div>
       <div class="ansLbl">Student's answer</div>
       <template x-if="q.opts.length">
        <div><template x-for="(o,oi) in q.opts" :key="oi">
         <div class="opt" :class="o[2]">
          <span class="b" x-text="o[0]"></span>
          <span class="x" x-text="o[1]"></span>
          <span class="v" x-text="o[2]"></span>
         </div></template></div>
       </template>
       <template x-if="!q.opts.length">
        <div class="written" x-text="q.written.join('\n')"></div>
       </template>
      </div>
     </div>
    </div>
   </template>
  </div>
 </div>
</div>
<script>
function g(){return{
 idx:0, exams:[],
 init(){ this.exams=window.GRADEO||[]; },
 get ex(){ return this.exams[this.idx]||{title:'',rows:[],qs:[],mark:0,avail:0} },
 cls(m){ const p=String(m).split(' out of '); if(p.length<2)return 'part';
   const a=parseFloat(p[0]),b=parseFloat(p[1]);
   return a>=b?'full':(a<=0?'zero':'part'); }
}}
</script></body></html>
